<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2438">
<title>Matilda's Black Belt Birthday</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="game-next/fonts/baloo2.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Baloo 2 (SIL Open Font License) shipped with the game, so every word is in it from the first frame */
  @font-face{font-family:'Baloo 2';src:url(game-next/fonts/baloo2.woff2) format('woff2');font-weight:400 800;font-display:block}
  :root{--ink:#2b2438;--pink:#ff5fa2;--lemon:#ffd23f}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;overscroll-behavior:none;font-family:'Baloo 2',system-ui,sans-serif}
  #game{position:fixed;inset:0;touch-action:none}
  #game canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:radial-gradient(circle at 50% 35%,#5b3f9e,#2b2438 70%)}
  .scr[hidden]{display:none}
  #title{margin:0;font-size:clamp(30px,7vw,64px);line-height:.92;color:var(--pink);font-weight:800;text-shadow:0 4px 0 #fff,0 8px 0 rgba(0,0,0,.35);transform:scale(.9);opacity:.85}
  #title small{display:block;font-size:.36em;color:var(--lemon);text-shadow:0 3px 0 var(--ink);margin-top:10px;letter-spacing:.06em}
  #title.live{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both,bob 1.6s 0.7s ease-in-out infinite alternate}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes bob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-6px) rotate(1deg)}}
  #loadBox{width:min(420px,70vw)}
  #bar{height:16px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;border:3px solid #fff}
  #barIn{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--lemon));transition:width .2s}
  #loadBox.thin #bar{height:6px;border-width:1px;opacity:.6} #loadBox.thin #loadTxt{display:none}
  #loadTxt{color:#fff;font-weight:800;margin-top:6px;font-size:15px}
  .btn{font:inherit;font-weight:800;font-size:24px;border:0;border-radius:999px;padding:10px 40px;background:var(--pink);color:#fff;box-shadow:0 6px 0 #b8306a,0 10px 20px rgba(0,0,0,.35);cursor:pointer}
  #tapStart{font-size:30px;padding:12px 56px;animation:breathe 1.2s ease-in-out infinite alternate}
  @keyframes breathe{to{transform:scale(1.06)}}
  @keyframes blink{50%{opacity:.25}}
  .hint{margin:0;max-width:680px;color:#fff;opacity:.75;font-size:clamp(12px,2vw,15px)}
  /* controls, console style. Left thumb: big arrows, low in the corner. Right thumb: JUMP the biggest, bottom right;
     PUNCH to its left, KICK above PUNCH, STORM small and higher up. Every button at least 64 px, inside the safe area. */
  #controls{position:fixed;inset:0;z-index:5;pointer-events:none;--sl:max(14px,env(safe-area-inset-left));--sr:max(14px,env(safe-area-inset-right));--sb:max(12px,env(safe-area-inset-bottom));--g:12px;--A:clamp(76px,25vh,108px);--J:clamp(88px,30vh,124px);--P:clamp(68px,22vh,94px);--S:64px}
  #controls[hidden]{display:none}
  .cb{position:absolute;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border:0;border-radius:50%;font:inherit;font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .05s,filter .05s;-webkit-tap-highlight-color:transparent;opacity:.62;padding:0;outline:2px solid rgba(43,36,56,.55);outline-offset:-1px}
  .cb.down{opacity:.85;transform:translateY(4px) scale(.96);filter:brightness(1.25);box-shadow:0 2px 0 rgba(0,0,0,.25),0 0 0 4px #fff}
  #bL,#bR{width:var(--A);height:var(--A);bottom:var(--sb);border-radius:24px;background:#6a5fbf;font-size:calc(var(--A)*.36)}
  #bL{left:var(--sl)} #bR{left:calc(var(--sl) + var(--A) + var(--g))}
  #bJ{width:var(--J);height:var(--J);right:var(--sr);bottom:var(--sb);background:#3a8cff;font-size:calc(var(--J)*.2)}
  #bP{width:var(--P);height:var(--P);right:calc(var(--sr) + var(--J) + var(--g));bottom:var(--sb);background:#e03a3a;font-size:calc(var(--P)*.2)}
  #bK{width:var(--P);height:var(--P);right:calc(var(--sr) + var(--J) + var(--g));bottom:calc(var(--sb) + var(--P) + var(--g));background:#ff8a2a;font-size:calc(var(--P)*.22)}
  #bS{width:var(--S);height:var(--S);right:calc(var(--sr) + (var(--J) - var(--S)) / 2);bottom:calc(var(--sb) + var(--J) + var(--g) + 8px);background:rgba(43,36,56,.5);font-size:12px;color:rgba(255,255,255,.6)}
  #bS.ready{background:radial-gradient(#ffd23f,#ff5fa2);color:#fff;animation:pulse .6s infinite alternate;box-shadow:0 0 0 4px #fff,0 0 24px #ffd23f}
  #bS.storming{background:#ffd23f;color:#2b2438}
  @keyframes pulse{to{transform:scale(1.1)}}
  #muteBtn{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:12;pointer-events:auto;background:rgba(43,36,56,.45);border:0;border-radius:50%;width:40px;height:40px;font-size:18px}
  #againBtn{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));right:max(14px,env(safe-area-inset-right));z-index:12;font-size:18px;padding:8px 22px}
  /* the wipe between scenes: a quick diagonal sweep in the game's colours, never a hard cut or a blank frame */
  #wipe{position:fixed;top:-20%;bottom:-20%;left:-30%;width:160%;z-index:25;pointer-events:none;transform:translateX(-120%) skewX(-14deg);background:linear-gradient(100deg,#ff5fa2 0%,#ff5fa2 8%,#5b3f9e 8%,#5b3f9e 14%,#2b2438 14%,#2b2438 86%,#5b3f9e 86%,#5b3f9e 92%,#ffd23f 92%);will-change:transform}
  #wipe.cover{transform:translateX(0) skewX(-14deg);transition:transform .32s cubic-bezier(.7,0,.3,1)}
  #wipe.out{transform:translateX(120%) skewX(-14deg);transition:transform .34s cubic-bezier(.7,0,.3,1)}
  #wipe .mono{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) skewX(14deg);color:#fff;font-weight:800;font-size:clamp(20px,5vh,34px);letter-spacing:.08em;opacity:.9}
  /* the round buttons share the HUD's look: a white rim, a soft top light and a darker base */
  .cb{border:3px solid rgba(255,255,255,.9)!important;text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.02em;background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%,rgba(0,0,0,.12))!important}
  #pauseBtn{position:fixed;top:max(8px,env(safe-area-inset-top));right:calc(max(10px,env(safe-area-inset-right)) + 48px);z-index:12;pointer-events:auto;background:rgba(43,36,56,.55);border:2px solid rgba(255,255,255,.85);border-radius:50%;width:40px;height:40px;color:#fff;font:800 15px 'Baloo 2',system-ui,sans-serif;padding:0}
  #pauseBtn[hidden]{display:none}
  #pauseScreen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(43,36,56,.82);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #pauseScreen[hidden]{display:none}
  #pauseScreen h2{margin:0 0 6px;color:#ffd23f;font-size:clamp(30px,8vh,52px);text-shadow:0 4px 0 #2b2438}
  #pauseScreen .btn{min-width:min(260px,60vw);font-size:clamp(17px,4.6vh,24px)}
  #pauseScreen .btn.alt{background:#5b3f9e;box-shadow:0 6px 0 #3a2870,0 10px 20px rgba(0,0,0,.35)}
  /* held upright: a friendly turn me sideways card with Matilda */
  #portrait{display:none}
  @media (orientation:portrait) and (pointer:coarse){#portrait{display:flex;flex-direction:column;gap:14px;position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 35%,#5b3f9e,#2b2438 70%);color:#fff;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:24px;padding:24px}}
  #portrait img{width:min(30vw,112px);animation:tilt 2.2s ease-in-out infinite}
  #portrait .phone{font-size:44px;display:inline-block;animation:turn 2.2s ease-in-out infinite}
  @keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}
  @keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
</style>
</head>
<body>
<div id="game"></div>
<div id="controls" hidden>
  <button class="cb" id="bL" aria-label="Left">◀</button><button class="cb" id="bR" aria-label="Right">▶</button>
  <button class="cb" id="bP">PUNCH</button><button class="cb" id="bK">KICK</button><button class="cb" id="bJ">JUMP</button>
  <button class="cb" id="bS">STORM</button>
</div>
<button id="muteBtn" aria-label="Sound on or off">🔊</button>
<button id="pauseBtn" aria-label="Pause" hidden>II</button>
<div id="pauseScreen" hidden><h2>Paused</h2><button class="btn" id="resumeBtn">Play on</button><button class="btn alt" id="restartBtn">Back to the last flag</button><button class="btn alt" id="soundBtn">Sound: on</button></div>
<button class="btn" id="againBtn" hidden>Play again</button>
<div class="scr" id="startScreen">
  <h1 id="title">MATILDA'S<br>BLACK BELT<br>BIRTHDAY<small>THE STREET · THE PARK · PARTY ROAD</small></h1>
  <div id="loadBox"><div id="bar"><div id="barIn"></div></div><div id="loadTxt">Loading…</div></div>
  <button class="btn" id="tapStart" hidden>PLAY</button>
  <button class="btn" id="playBtn" hidden>PLAY</button>
  <p class="hint" id="hint"></p>
</div>
<div id="wipe"><div class="mono">★</div></div>
<div id="portrait"><img src="game-next/img/portrait_mat.webp" alt=""><div>Turn me sideways to play!</div><div class="phone">📱</div></div>
<script>
(function () {
  var touch = window.matchMedia("(pointer: coarse)").matches;
  document.getElementById("hint").textContent = touch ? "◀ ▶ run · JUMP (twice in the air) · PUNCH PUNCH KICK launches · hold KICK to block (green belt) · STORM when it glows" : "Arrows run · space jumps (twice in the air) · X punch, C kick: X X C launches · hold C to block (green belt) · B Storm · M mute";
  var barIn = document.getElementById("barIn"), txt = document.getElementById("loadTxt");
  window.setLoad = function (v, t) { barIn.style.width = Math.round(Math.max(0, Math.min(1, v)) * 100) + "%"; if (t !== undefined) txt.textContent = t; };
  /* the engine (Phaser and the game code) loads first with its own progress, then the art and music */
  var x = new XMLHttpRequest(); x.open("GET", "game-next/engine.js?v=20261011015141");
  x.onprogress = function (e) { var tot = e.lengthComputable ? e.total : 1500000; window.setLoad(0.35 * Math.min(1, e.loaded / tot), "Loading the game…"); };
  x.onload = function () { if (x.status !== 200) { txt.textContent = "Could not load. Pull down to try again."; return; } var s = document.createElement("script"); s.text = x.responseText; document.body.appendChild(s); };
  x.onerror = function () { txt.textContent = "No connection. Pull down to try again."; };
  x.send();
})();
</script>
</body>
</html>
